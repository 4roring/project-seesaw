<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline Seesaw — Web Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ── 덱 선택 ───────────────────────────────────────────── -->
    <section class="screen" id="screen-select">
      <h1 class="title">Timeline Seesaw</h1>
      <p class="subtitle">하나의 기세를 밀고 당기는 무림 덱빌딩 로그라이크 · 스테이지 1~10</p>
      <p class="subtitle"><a class="guide-link" href="guide.html">처음이신가요? 30초 안내 →</a></p>
      <div class="deck-grid" id="deck-grid"></div>
    </section>

    <!-- ── 신병이기 선택 ────────────────────────────────────── -->
    <section class="screen hidden" id="screen-weapon">
      <h2 class="title">신병이기(神兵利器)</h2>
      <p class="subtitle" id="weapon-sub"></p>
      <div class="weapon-grid" id="weapon-grid"></div>
      <div class="reward-actions">
        <button id="skip-weapon-btn" class="ghost-btn">맨손으로 나선다</button>
      </div>
    </section>

    <!-- ── 전투 ─────────────────────────────────────────────── -->
    <section class="screen hidden" id="screen-battle">
      <header class="battle-header">
        <div class="stage-info">
          <span class="stage-badge" id="stage-badge">STAGE 1</span>
          <span class="stage-name" id="stage-name"></span>
          <span class="node-echo" id="node-echo"></span>
        </div>
        <div class="header-right">
          <span class="turn-info"><span id="turn-count">1</span>합</span>
          <button id="rules-btn" class="ghost-btn">규칙 ?</button>
          <button id="restart-btn" class="ghost-btn">런 포기</button>
        </div>
      </header>

      <!-- 1:1 대전 무대 -->
      <div class="arena" id="arena">
        <div class="fighter player-side" id="player-fighter">
          <div class="fx-layer" id="player-fx"></div>
          <div class="avatar" id="player-avatar">🔥</div>
          <div class="fighter-name" id="player-name">플레이어</div>
          <div class="bar-wrap">
            <div class="bar-track"><div class="bar-fill hp player" id="player-hp-fill"></div></div>
            <div class="bar-text" id="player-hp-text">70 / 70</div>
          </div>
          <div class="weapon-strip" id="weapon-strip"></div>
          <div class="badges" id="player-badges"></div>
        </div>

        <div class="versus" id="versus">VS</div>

        <div class="fighter enemy-side" id="enemy-fighter">
          <div class="fx-layer" id="enemy-fx"></div>
          <div class="avatar" id="enemy-avatar">🗿</div>
          <div class="fighter-name" id="enemy-name">적</div>
          <div class="bar-wrap">
            <div class="bar-track"><div class="bar-fill hp enemy" id="boss-hp-fill"></div></div>
            <div class="bar-text" id="boss-hp-text">120 / 120</div>
          </div>
          <div class="badges" id="boss-badges"></div>
        </div>
      </div>

      <!-- 공유 기세 -->
      <section class="panel gauge-panel">
        <div class="gauge-track" id="gauge-track">
          <div class="gauge-cells" id="gauge-cells"></div>
          <div class="gauge-marker" id="gauge-marker"></div>
          <div class="memory-fx" id="memory-fx"></div>
        </div>
        <div class="gauge-caption" id="gauge-caption"></div>
        <div class="intent-preview" id="intent-preview"></div>
        <div class="boss-skill-legend" id="boss-skill-legend"></div>
      </section>

      <section class="play-zone" id="play-zone">초식을 여기로 드래그해 사용 (클릭도 가능)</section>

      <div class="surge-meter" id="surge-meter"></div>

      <div class="combo-row">
        <span class="combo-label">연환</span>
        <div class="combo-dots" id="combo-dots"></div>
        <span class="combo-hint">초식 3장을 이으면 카드 1장 추가 드로우</span>
      </div>

      <section class="panel">
        <div class="hand-row" id="hand-row"></div>
      </section>

      <div class="controls-row">
        <div class="pile-counts" id="pile-counts"></div>
        <button id="draw-btn">숨 고르기 (기세 2 · 카드 1장)</button>
      </div>

      <details class="log-fold" id="log-fold">
        <summary class="log-summary"><span id="log-last">기록</span></summary>
        <section class="panel log-panel" id="log-panel"></section>
      </details>
    </section>

    <!-- ── 비무 전리품 ──────────────────────────────────────── -->
    <section class="screen hidden" id="screen-reward">
      <h2 class="title" id="reward-title">스테이지 클리어</h2>
      <p class="subtitle" id="reward-sub"></p>
      <h3 class="reward-heading" id="reward-heading">전리품 — 초식 하나를 거둡니다</h3>
      <div class="reward-grid" id="reward-grid"></div>
      <div class="reward-actions">
        <button id="skip-reward-btn" class="ghost-btn">거두지 않는다</button>
      </div>
    </section>

    <!-- ── 갈림길 ───────────────────────────────────────────── -->
    <section class="screen hidden" id="screen-crossroad">
      <h2 class="title">갈림길</h2>
      <p class="subtitle" id="crossroad-sub"></p>
      <div class="crossroad-grid" id="crossroad-grid"></div>
    </section>

    <!-- ── 걸음 안의 선택 ───────────────────────────────────── -->
    <section class="screen hidden" id="screen-node">
      <h2 class="title" id="node-title">걸음</h2>
      <p class="subtitle" id="node-sub"></p>
      <div class="node-body" id="node-body"></div>
    </section>

    <!-- ── 런 종료 ──────────────────────────────────────────── -->
    <section class="screen hidden" id="screen-result">
      <h2 class="title" id="result-title">런 종료</h2>
      <p class="subtitle" id="result-sub"></p>
      <button id="result-restart-btn" class="primary-btn">새 런 시작</button>
    </section>

    <!-- ── 규칙 창 ──────────────────────────────────────────── -->
    <!-- 화면들 밖에 둔다 — screen 안에 넣으면 showScreen이 같이 숨긴다. -->
    <div class="rules-overlay hidden" id="rules-overlay">
      <div class="rules-box">
        <h3 class="rules-title">규칙은 두 개뿐입니다</h3>
        <div class="rules-body" id="rules-body"></div>
        <button class="primary-btn" id="rules-close">알겠습니다</button>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="run.js"></script>
  <script src="ui.js"></script>
  <script>TS_UI.init();</script>
</body>
</html>
